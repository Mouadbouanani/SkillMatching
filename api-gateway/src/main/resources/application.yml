spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      grpc:
        enabled: false
      filter:
        json-to-grpc:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600

      routes:
        # Public Auth Routes (No AuthenticationFilter)
        - id: public-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/register, /api/users/login, /api/users/forgot-password, /api/users/health
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker

        # Protected User Service Routes
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker

        # Public Profile Routes
        - id: public-profiles
          uri: http://profile-service:8082
          predicates:
            - Path=/api/profiles/public/**, /api/profiles/health
          filters:
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        # Protected Profile Service Routes
        - id: profile-service
          uri: http://profile-service:8082
          predicates:
            - Path=/api/profiles/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 100
                  burstCapacity: 200
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        # Public Job Routes
        - id: public-jobs
          uri: http://job-service:8083
          predicates:
            - Path=/api/jobs/public/**, /api/jobs/all, /api/jobs/health, /api/info/categories
          filters:
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        # Protected Job Service Routes
        - id: job-service
          uri: http://job-service:8083
          predicates:
            - Path=/api/jobs/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 50
                  burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        # Protected Matching Service Routes
        - id: matching-service
          uri: http://matching-service:8084
          predicates:
            - Path=/api/matches/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 50
                  burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: matchingServiceCircuitBreaker

        # Protected Notification Service Routes
        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker

        # Protected Messaging Service Routes
        - id: messaging-service
          uri: http://messaging-service:8086
          predicates:
            - Path=/api/messages/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: messagingServiceCircuitBreaker

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.skillmatching: DEBUG
    org.springframework.cloud.gateway: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always