spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      grpc:
        enabled: false
      filter:
        json-to-grpc:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5500"
              - "http://127.0.0.1:5500"
              - "http://localhost:8000"
              - "http://127.0.0.1:8000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET,POST

      routes:
        - id: public-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/register, /api/users/login, /api/users/forgot-password, /api/users/health
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker

        - id: public-profiles
          uri: http://profile-service:8082
          predicates:
            - Path=/api/profiles/public/**, /api/profiles/health
          filters:
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        - id: profile-service
          uri: http://profile-service:8082
          predicates:
            - Path=/api/profiles/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        - id: public-jobs
          uri: http://job-service:8083
          predicates:
            - Path=/api/jobs/public/**, /api/jobs/all, /api/jobs/health, /api/info/categories
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        - id: job-service
          uri: http://job-service:8083
          predicates:
            - Path=/api/jobs/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        - id: matching-service
          uri: http://matching-service:8084
          predicates:
            - Path=/api/matches/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: matchingServiceCircuitBreaker

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker

        - id: messaging-service
          uri: http://messaging-service:8086
          predicates:
            - Path=/api/messages/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: messagingServiceCircuitBreaker

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s

eureka:
  client:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.skillmatching: DEBUG
    org.springframework.cloud.gateway: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always