spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      grpc:
        enabled: false
      filter:
        json-to-grpc:
          enabled: false
      
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://localhost:*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - "Authorization"
              - "Content-Type"

      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_LAST
        - name: Retry
          args:
            retries: 3
            methods: GET,POST

      routes:
        # Public Auth Routes (NO AUTHENTICATION REQUIRED)
        - id: public-auth
          uri: lb://user-service
          predicates:
            - Path=/api/users/register,/api/users/login,/api/users/forgot-password,/api/users/health
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # Protected User Service Routes
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker

        # Public Profile Routes
        - id: public-profiles
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/public/**, /api/profiles/health
          filters:
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        # Protected Profile Service Routes
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 100
                  burstCapacity: 200
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: profileServiceCircuitBreaker

        # Public Job Routes
        - id: public-jobs
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/public/**, /api/jobs/all, /api/jobs/health, /api/info/categories
          filters:
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        # Protected Job Service Routes
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/jobs/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 50
                  burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: jobServiceCircuitBreaker

        # Protected Matching Service Routes
        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/matches/**
          filters:
            - name: AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 50
                  burstCapacity: 100
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: matchingServiceCircuitBreaker

        # Protected Notification Service Routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker

        # Protected Messaging Service Routes
        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/api/messages/**
          filters:
            - name: AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: messagingServiceCircuitBreaker

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.skillmatching: DEBUG
    org.springframework.cloud.gateway: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always