spring:
  application:
    name: eureka-server
  profiles:
    active: dev

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 1000

logging:
  level:
    root: INFO
    com.netflix.eureka: WARN