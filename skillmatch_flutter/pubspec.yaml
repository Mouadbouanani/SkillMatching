name: skillmatch
description: SkillMatch - Skill matching platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_form_builder: ^9.2.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2
  dio: ^5.7.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Forms
  #form_builder_flutter: ^9.0.0

  # Local Storage
  shared_preferences: ^2.4.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true