spring:
  application:
    name: messaging-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Firebase Configuration
firebase:
  credentials-location: classpath:firebase-service-account.json
  project-id: ${FIREBASE_PROJECT_ID:skillmatching-86b8d}

server:
  port: 8086
  servlet:
    context-path: /api/messages

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.skillmatching.messagingservice: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always