spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://ep-bold-base-a89vb20k-pooler.eastus2.azure.neon.tech:5432/user_service_db?sslmode=require
    username: neondb_owner
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  security:
    user:
      name: admin
      password: admin
server:
  port: 8081
  servlet:
    context-path: /api/users

logging:
  level:
    root: INFO
    com.skillmatch: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:file:config/firebase-credentials.json}