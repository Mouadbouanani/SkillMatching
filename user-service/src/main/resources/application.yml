spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/skill_matching_userdb
    username: postgres
    password: ${DB_PASSWORD:admin37}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  security:
    user:
      name: admin
      password: admin
server:
  port: 8081
  servlet:
    context-path: /api/users

logging:
  level:
    root: INFO
    com.skillmatch: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:file:config/firebase-credentials.json}