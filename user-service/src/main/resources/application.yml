spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://postgres:5432/skill_match_users
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8081
  servlet:
    context-path: /api/users

logging:
  level:
    root: INFO
    com.skillmatch: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:file:config/firebase-credentials.json}