spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_DB_NAME:user_service_db}${DB_PARAMS:?sslmode=disable}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  security:
    user:
      name: admin
      password: admin
server:
  port: 8081
  servlet:
    context-path: /api/users

logging:
  level:
    root: INFO
    com.skillmatch: DEBUG

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:file:config/firebase-credentials.json}