version: '3.9'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - skillmatch-network

  # PostgreSQL for user-service, job-service, and matching-service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: skillmatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skillmatch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillmatch-network

  # Kafka for event-driven services
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    networks:
      - skillmatch-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - skillmatch-network

networks:
  skillmatch-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
