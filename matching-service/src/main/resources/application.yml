spring:
  application:
    name: matching-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MATCHING_DB_NAME:skillmatching_matches}${DB_PARAMS:?sslmode=disable}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_OKUFJBD5qw4f}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: matching-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.skillmatching.jobservice.event.JobCreatedEvent:com.skillmatching.matchingservice.dto.JobCreatedEvent"

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

# Server configuration
server:
  port: 8084
  servlet:
    context-path: /api/matches

# Service URLs for inter-service communication
services:
  job-service:
    url: ${JOB_SERVICE_URL:http://job-service}
  profile-service:
    url: ${PROFILE_SERVICE_URL:http://profile-service}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service}

# Logging
logging:
  level:
    root: INFO
    com.skillmatching.matchingservice: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

# Eureka configuration
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Matching Algorithm Configuration
matching:
  algorithm:
    # Minimum score (0-100) required to create a match
    threshold: 50.0
    # Maximum matches to create per job
    max-matches-per-job: 10
    # Weights for scoring components (must sum to 1.0)
    weights:
      skill-match: 0.40
      experience: 0.25
      rating: 0.20
      location: 0.15